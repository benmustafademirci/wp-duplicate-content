name: PHP syntax checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Check PHP syntax for all plugin and test files
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 |
            xargs -0 -r -n 1 php -l

      - name: Test post type settings behavior
        run: php tests/test-post-types.php

      - name: Test status settings behavior
        run: php tests/test-post-status.php

      - name: Test publishing capabilities
        run: php tests/test-publishing-permissions.php
